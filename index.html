<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>My Tasks</h1>
      <p class="task-count" id="taskCount">0 tasks</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        type="text"
        id="taskInput"
        class="task-input"
        placeholder="What do you need to do?"
        autocomplete="off"
      >
      <button type="submit" class="add-btn">Add</button>
    </form>

    <p id="errorMsg" class="error-msg"></p>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started.</p>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h2>Edit Task</h2>
      <input type="text" id="editInput" class="task-input">
      <p id="editErrorMsg" class="error-msg"></p>
      <div class="modal-actions">
        <button id="cancelEdit" class="btn-secondary">Cancel</button>
        <button id="saveEdit" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
